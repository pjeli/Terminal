# Releases (0.47.10, the player's call): pushing a version tag ("0.48.0") has the BigWigs packager build Terminal and
# Terminal Extras (.pkgmeta), fill in the translations from CurseForge's localization tool (the --@localization@
# keywords in Locales/), and upload the ZIP to CurseForge (and a GitHub release).
# Once: add a CurseForge API token (curseforge.com > account > API tokens) as this repository's secret CF_API_KEY.
name: Package and release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    # The packager adds its ZIP to the tag's GitHub release; the token is read-only without this (0.48.0's run: CurseForge
    # took the upload, then "Resource not accessible by integration" (403) on updating the release, and the job failed).
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository with its history (the changelog and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release's notes are this version's part of CHANGELOG.md alone (0.50.0, the player's ask: the whole history
      # went up with each release): from its "## <tag>" heading to the next one (else the newest part). The ZIP still
      # carries the whole CHANGELOG.md; .pkgmeta reads RELEASE_NOTES.md and leaves it out of the ZIP.
      - name: Release notes from this version's part of the changelog
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            /^## / { if (found) exit; if ($2 == v) found = 1 }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::CHANGELOG.md has no '## $GITHUB_REF_NAME' heading: the newest part is used"
            awk '{ sub(/\r$/, "") } /^## / { n++ } n == 1 { print }' CHANGELOG.md > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
      - name: Package and upload
        uses: BigWigsMods/packager@v2
        # The TOCs list WoW Forever alone (16001, 0.48.1), and with a single game version the packager adds it to the
        # file's name and label ("Terminal-0.48.1-forever.zip"): both are "Terminal-<version>.zip" (0.50.0, the player's
        # ask: CurseForge listed the file as "0.48.1"), the file on CurseForge and on GitHub alike.
        with:
          args: -n "{package-name}-{project-version}:{package-name}-{project-version}.zip"
